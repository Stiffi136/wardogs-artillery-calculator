name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Whisper model for the static site
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="onnx-community/whisper-base",
              revision="0dc963c325ab2554e6dcedbb458decbffb4dc5b1",
              local_dir="public/models/onnx-community/whisper-base",
              allow_patterns=[
                  "config.json",
                  "generation_config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "preprocessor_config.json",
                  "onnx/encoder_model.onnx",
                  "onnx/decoder_model_merged.onnx",
              ],
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
